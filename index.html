<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>🎂 给坏女人</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    /* 用 dvh 动态视口高度，自动排除手机浏览器地址栏/工具栏 */
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
  }
  /* 回退：不支持 dvh 的旧浏览器用 vh */
  @supports not (height: 100dvh) {
    html, body { height: 100vh; }
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1e 100%);
    position: relative;
    user-select: none;
    transition: background 2s;
  }

  /* 星空已迁移到 Three.js 3D 粒子（见 initCake3D） */

  #scene-canvas {
    position: fixed;
    inset: 0;
    z-index: 4;
  }

  /* Three.js 3D 蛋糕挂载点：透明背景叠加在 2D canvas 之上 */
  #cake-3d {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;   /* 默认不拦截点击，避免挡住下方按钮；需要拖拽时单独开启 */
  }
  #cake-3d canvas {
    display: block;
  }

  /* 礼物盒 */
  #gift {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 20;
    cursor: pointer;
    transition: opacity 0.4s;
  }
  /* 开盒动效关键帧（giftShake 抖动 + giftBurst 爆开淡出） */
  @keyframes giftShake {
    0%, 100% { transform: scale(1) rotate(0); }
    25% { transform: scale(1.15) rotate(-8deg); }
    50% { transform: scale(1.2) rotate(8deg); }
    75% { transform: scale(1.15) rotate(-5deg); }
  }
  @keyframes giftBurst {
    0% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 30px rgba(255,200,100,0.8)); }
    50% { transform: scale(1.8); opacity: 1; filter: drop-shadow(0 0 80px rgba(255,240,200,1)); }
    100% { transform: scale(2.5); opacity: 0; filter: drop-shadow(0 0 120px rgba(255,255,255,1)); }
  }
  /* 光芒爆发层：从礼物盒中心迸发的强光 */
  #gift-burst {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,250,220,0.95) 0%, rgba(255,200,100,0.6) 30%, rgba(255,150,200,0.2) 60%, transparent 80%);
    transform: translate(-50%, -50%);
    z-index: 19;
    pointer-events: none;
    opacity: 0;
  }
  #gift-burst.burst {
    animation: burstFlash 0.9s ease-out forwards;
  }
  @keyframes burstFlash {
    0% { width: 0; height: 0; opacity: 0; }
    30% { width: 300px; height: 300px; opacity: 1; }
    100% { width: 1200px; height: 1200px; opacity: 0; }
  }
  #gift.hide {
    opacity: 0;
    pointer-events: none;
  }
  .gift-box {
    font-size: 140px;
    animation: bounce 1.5s infinite ease-in-out;
    filter: drop-shadow(0 0 30px rgba(255, 200, 100, 0.8));
  }
  /* 开盒时停止跳动，交给 opening 动画接管 */
  #gift.opening .gift-box {
    animation: giftShake 0.3s ease, giftBurst 0.5s 0.3s ease forwards;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-25px) rotate(5deg); }
  }
  /* 3D 立体云朵对话气泡：用大号 ☁️ emoji 做天然云朵底，文字浮于其上 */
  .gift-hint {
    position: absolute;
    bottom: 100%;
    right: 50%;
    margin-bottom: 24px;
    margin-right: 60px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
    pointer-events: none;
  }
  .gift-hint-cloud {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 6px 16px rgba(255, 150, 200, 0.5));
    animation: cloudFloat 4s infinite ease-in-out;
  }
  /* 云朵底：大号白色 ☁️ emoji，自带立体蓬松感 */
  .gift-hint-cloud-bg {
    font-size: 320px;
    line-height: 1;
    color: #ffffff;
    text-shadow:
      0 0 4px rgba(255, 230, 240, 0.9),
      0 4px 12px rgba(255, 150, 200, 0.3);
    user-select: none;
  }
  /* 文字层：绝对居中浮在云朵上 */
  .gift-hint-text {
    position: absolute;
    color: #d6336c;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    white-space: nowrap;
    z-index: 2;
    /* 向下偏一点，避开云朵顶部蓬松处 */
    transform: translateY(10px);
  }
  /* 云朵尾巴：指向右下方礼物盒 */
  .gift-hint-tail {
    font-size: 36px;
    line-height: 1;
    color: #ffffff;
    text-shadow: 0 2px 6px rgba(255,150,200,0.3);
    transform: rotate(-30deg);
    margin-left: -18px;
    margin-top: 30px;
    align-self: flex-end;
    user-select: none;
  }
  @keyframes cloudFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  /* 手指：独立定位，在云朵右下方、礼物盒左上方之间 */
  .gift-hint-hand {
    position: absolute;
    top: -40px;        /* 电脑端：礼物盒上方更高（云朵更远） */
    left: -80px;       /* 电脑端：更靠左（云朵在更左上方） */
    font-size: 40px;
    transform: rotate(-30deg);
    animation: handPoint 1s infinite ease-in-out;
    z-index: 21;
    pointer-events: none;
  }
  @keyframes handPoint {
    0%, 100% { transform: rotate(-30deg) translate(0, 0); }
    50% { transform: rotate(-30deg) translate(8px, 8px); }   /* 沿指向方向戳动 */
  }
  .gift-text {
    margin-top: 24px;
    color: #fff;
    font-size: 18px;
    letter-spacing: 3px;
    opacity: 0.9;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* 名字 */
  /* 右侧面板：「坏女人」在祝福语中间的上方，整体居中对齐 */
  #right-panel {
    position: fixed;
    top: 14%;
    right: 5%;
    z-index: 12;
    display: flex;
    flex-direction: column;
    align-items: center;   /* 居中：让「坏女人」对齐祝福语水平中点 */
    gap: 14px;
    pointer-events: none;
  }
  .name-wrap {
    opacity: 0;
    transition: opacity 0.8s;
  }
  .name-wrap.show { opacity: 1; }
  .name {
    font-size: 56px;
    font-weight: 900;
    font-family: "Ma Shan Zheng", "ZCOOL XiaoWei", cursive;
    background: linear-gradient(90deg,
      #ff6b9d 0%, #feca57 25%, #48dbfb 50%, #feca57 75%, #ff6b9d 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 8px;
    filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
    animation: nameShimmer 3s linear infinite;
  }
  @keyframes nameShimmer {
    from { background-position: 200% 0; }
    to { background-position: 0 0; }
  }

  /* 祝福语 - 笔画动画 Canvas（在右侧面板内，紧跟「坏女人」下方） */
  #wish-canvas {
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
  }
  #wish-canvas.show { opacity: 1; }

  /* 按钮 */
  .actions {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 65;   /* 高于遮罩(50)和信封(60)，确保许愿流程中按钮可点击 */
    display: flex;
    gap: 16px;
    opacity: 0;
    transition: opacity 0.8s;
    pointer-events: none;
  }
  .actions.show {
    opacity: 1;
    pointer-events: auto;
  }
  .btn {
    padding: 12px 28px;
    border: 1.5px solid rgba(255, 215, 0, 0.5);
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    letter-spacing: 2px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
  }
  .btn:hover {
    background: rgba(255, 215, 0, 0.15);
    border-color: rgba(255, 215, 0, 0.8);
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
    transform: translateY(-2px);
  }
  .btn:active { transform: translateY(0); }
  .btn.primary {
    background: rgba(255, 107, 157, 0.2);
    border-color: rgba(255, 107, 157, 0.6);
    box-shadow: 0 0 20px rgba(255, 107, 157, 0.3);
  }
  .btn.primary:hover {
    background: rgba(255, 107, 157, 0.3);
    border-color: rgba(255, 107, 157, 1);
    box-shadow: 0 0 30px rgba(255, 107, 157, 0.5);
  }
  .btn.hidden { display: none; }

  .hint {
    position: fixed;
    bottom: 90px;   /* 手机端：靠近蛋糕下方 */
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.9);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
    white-space: nowrap;
    text-shadow: 0 0 16px rgba(255, 200, 100, 0.6);
    z-index: 65;
    opacity: 0;
    transition: opacity 1s;
  }
  /* 电脑端（宽屏）：hint 放在蛋糕左边、狮子座下面 */
  @media (min-width: 769px) {
    .hint {
      left: 8%;
      bottom: 30%;
      transform: none;
      text-align: left;
    }
  }
  .hint.show { opacity: 1; }

  @media (max-width: 480px) {
    .name { font-size: 32px; letter-spacing: 5px; }
    .wish { font-size: 16px; }
    .gift-box { font-size: 140px; }
    .gift-hint-text { font-size: 16px; }
    .gift-hint-hand { font-size: 32px; }
    /* 移动端云朵大幅缩小（320px 在手机上太大） */
    /* 移动端云朵大幅缩小，确保不溢出屏幕、不遮挡 */
    .gift-hint-cloud-bg { font-size: 155px; }
    .gift-hint { margin-right: -20px; margin-bottom: 8px; }
    .gift-hint-text { font-size: 14px; }
    .gift-hint-hand { font-size: 26px; top: -20px; left: -10px; }   /* 手机端手指位置（比电脑端更靠近礼物盒） */
    /* 移动端：右侧面板整体缩小，避免重叠 */
    /* 移动端右侧面板缩小，避免遮挡蛋糕 */
    #right-panel { transform: scale(0.5); transform-origin: top right; top: 3%; right: 1%; }
    .actions { bottom: 28px; }
    .btn { padding: 10px 22px; font-size: 14px; }
    .hint { font-size: 18px; bottom: 80px; }
    /* 移动端信封/信纸/邮箱适配 */
    .envelope-body { font-size: 60px; }
    #letter { width: 240px; padding: 16px 12px; }
    .letter-title { font-size: 14px; margin-bottom: 10px; }
    #wish-input { font-size: 13px; padding: 8px; }
    #letter.letter-out { transform: translate(-50%, -160px) scale(1); }
    #letter-confirm { padding: 8px 18px; font-size: 13px; }
    #mailbox { font-size: 50px; left: 4%; bottom: 15%; }
  }
  }
  /* ===== 信封许愿功能 ===== */
  /* 背景遮罩 */
  #wish-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.65);
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s;
  }
  #wish-overlay.show { opacity: 1; pointer-events: auto; }

  /* 信封（居中，默认在屏幕下方隐藏） */
  #envelope {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, 200px) scale(0.5);
    z-index: 60; opacity: 0;
    transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s;
    pointer-events: none;
    display: flex; flex-direction: column; align-items: center;
  }
  #envelope.envelope-in {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1; pointer-events: auto;
  }
  /* 飞向邮箱：向左下方移动并缩小 */
  #envelope.envelope-to-mailbox {
    transform: translate(calc(-50% - 35vw), 80px) scale(0.2) rotate(-15deg);
    opacity: 0.3;
    transition: transform 0.9s ease-in, opacity 0.9s;
  }
  #envelope.envelope-gone {
    transform: translate(calc(-50% - 35vw), 80px) scale(0) rotate(-30deg);
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
  }
  .envelope-body {
    font-size: 100px; line-height: 1;
    filter: drop-shadow(0 4px 20px rgba(255, 200, 100, 0.6));
    animation: cloudFloat 3s infinite ease-in-out;
  }
  /* 信纸（默认藏在信封内） */
  #letter {
    position: absolute; top: -10px; left: 50%;
    transform: translate(-50%, 0) scale(0);
    opacity: 0;
    width: 320px; max-width: 80vw;
    background: linear-gradient(135deg, #fffef5, #fff8e8);
    border-radius: 12px;
    padding: 24px 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s;
    pointer-events: none;
  }
  #letter.letter-out {
    transform: translate(-50%, -260px) scale(1);
    opacity: 1; pointer-events: auto;
  }
  .letter-title {
    text-align: center; color: #d6336c;
    font-size: 17px; font-weight: 600;
    margin: 0 0 14px; letter-spacing: 1px;
  }
  #wish-input {
    width: 100%; box-sizing: border-box;
    border: 2px dashed #ffb6c1; border-radius: 8px;
    background: rgba(255, 255, 255, 0.7);
    padding: 12px; font-size: 15px; color: #444;
    font-family: "PingFang SC", "STKaiti", serif;
    resize: none; outline: none;
    transition: border-color 0.3s;
  }
  #wish-input:focus { border-color: #d6336c; }
  /* 信纸确认按钮 */
  #letter-confirm {
    display: block; margin: 14px auto 0;
    padding: 10px 24px;
    border: none; border-radius: 20px;
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 4px 14px rgba(214, 51, 108, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #letter-confirm:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(214, 51, 108, 0.5);
  }
  #letter-confirm:active { transform: translateY(0); }

  /* 邮箱（左侧偏下，不遮挡狮子座和祝福语） */
  #mailbox {
    position: fixed; left: 8%; bottom: 22%;
    z-index: 55; font-size: 80px; line-height: 1;
    opacity: 0; transform: scale(0);
    transition: opacity 0.5s, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
    pointer-events: none;
  }
  #mailbox.mailbox-show {
    opacity: 1; transform: scale(1);
  }
  #mailbox.mailbox-delivered {
    animation: mailboxShake 0.5s ease, mailboxGlow 1.5s ease;
  }
  @keyframes mailboxShake {
    0%, 100% { transform: scale(1) rotate(0); }
    25% { transform: scale(1.1) rotate(-5deg); }
    75% { transform: scale(1.1) rotate(5deg); }
  }
  @keyframes mailboxGlow {
    0%, 100% { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3)); }
    50% { filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9)); }
  }
</style>
</head>
<body>

<canvas id="scene-canvas"></canvas>
<div id="cake-3d"></div>

<div id="gift-burst"></div>
<div id="gift" onclick="celebrate()">
  <div class="gift-hint">
    <div class="gift-hint-cloud">
      <span class="gift-hint-cloud-bg">☁️</span>
      <span class="gift-hint-text" id="gift-hint-text"></span>
    </div>
  </div>
  <span class="gift-hint-hand">👇</span>
  <div class="gift-box">🎁</div>
</div>

<div id="right-panel">
  <canvas id="wish-canvas"></canvas>
</div>

<div class="actions" id="actions">
  <button class="btn" id="btn-wish" onclick="doWish()">🕯️ 许愿</button>
  <button class="btn primary hidden" id="btn-blow" onclick="doBlow()">🌬️ 对着手机吹一吹</button>
</div>

<div class="hint" id="hint"></div>

<!-- 信封许愿功能 -->
<div id="wish-overlay"></div>
<div id="envelope">
  <div class="envelope-body">✉️</div>
  <div id="letter">
    <p class="letter-title">写下你的生日愿望</p>
    <textarea id="wish-input" placeholder="我的愿望是..." rows="3"></textarea>
    <button id="letter-confirm" onclick="confirmWish()">写好啦～</button>
  </div>
</div>
<div id="mailbox">📮</div>

<script>

<script>
// ============ 音效系统 ============
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  // iOS Safari 必须在手势内显式 resume，否则 AudioContext 处于 suspended 不发声
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

// ============ 生日快乐歌（Web Audio API 合成） ============
// 音名到频率
const NOTE_FREQ = {
  'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
  'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
  'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46,
  'G5': 783.99, 'A5': 880.00, 'B5': 987.77,
  'rest': 0
};

// 生日快乐歌简谱（C大调）
// [音符, 拍数]  拍数：1=四分音符, 0.5=八分, 2=二分
const HAPPY_BIRTHDAY = [
  // Happy birthday to you
  ['C4', 0.75], ['C4', 0.25], ['D4', 1], ['C4', 1], ['F4', 1], ['E4', 2],
  // Happy birthday to you
  ['C4', 0.75], ['C4', 0.25], ['D4', 1], ['C4', 1], ['G4', 1], ['F4', 2],
  // Happy birthday dear ___
  ['C4', 0.75], ['C4', 0.25], ['C5', 1], ['A4', 1], ['F4', 1], ['E4', 1], ['D4', 2],
  // Happy birthday to you
  ['B4', 0.75], ['B4', 0.25], ['A4', 1], ['F4', 1], ['G4', 1], ['F4', 2]
];

let bgmTimer = null;
let bgmStopFlag = false;

function playNote(ctx, freq, startTime, duration) {
  if (freq === 0) return; // 休止符

  // 钢琴音色：正弦波（基音）+ 谐波（模拟泛音），快Attack慢Decay
  // 三个谐波叠加，让声音更圆润饱满

  // 基音（主音量）
  const osc1 = ctx.createOscillator();
  const gain1 = ctx.createGain();
  osc1.type = 'sine';
  osc1.frequency.value = freq;
  gain1.gain.setValueAtTime(0, startTime);
  gain1.gain.linearRampToValueAtTime(0.22, startTime + 0.01); // 快Attack（钢琴击键）
  gain1.gain.exponentialRampToValueAtTime(0.001, startTime + duration); // 慢Release（钢琴延音）
  osc1.connect(gain1);
  gain1.connect(ctx.destination);
  osc1.start(startTime);
  osc1.stop(startTime + duration);

  // 2倍频（八度，少量，增加亮度）
  const osc2 = ctx.createOscillator();
  const gain2 = ctx.createGain();
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2;
  gain2.gain.setValueAtTime(0, startTime);
  gain2.gain.linearRampToValueAtTime(0.08, startTime + 0.01);
  gain2.gain.exponentialRampToValueAtTime(0.001, startTime + duration * 0.7);
  osc2.connect(gain2);
  gain2.connect(ctx.destination);
  osc2.start(startTime);
  osc2.stop(startTime + duration);

  // 3倍频（十二度，更少，增加丰满感）
  const osc3 = ctx.createOscillator();
  const gain3 = ctx.createGain();
  osc3.type = 'sine';
  osc3.frequency.value = freq * 3;
  gain3.gain.setValueAtTime(0, startTime);
  gain3.gain.linearRampToValueAtTime(0.03, startTime + 0.01);
  gain3.gain.exponentialRampToValueAtTime(0.001, startTime + duration * 0.5);
  osc3.connect(gain3);
  gain3.connect(ctx.destination);
  osc3.start(startTime);
  osc3.stop(startTime + duration);
}

function playHappyBirthday(loop = true) {
  const ctx = getAudioCtx();
  const bpm = 95; // 速度放慢（原120，更舒缓）
  const beatDuration = 60 / bpm; // 一拍的秒数
  let currentTime = ctx.currentTime + 0.1;

  bgmStopFlag = false;

  function playMelody() {
    if (bgmStopFlag) return;
    currentTime = ctx.currentTime + 0.1;

    HAPPY_BIRTHDAY.forEach(([note, beats]) => {
      const freq = NOTE_FREQ[note];
      const duration = beats * beatDuration;
      if (freq > 0) {
        playNote(ctx, freq, currentTime, duration * 1.1); // 稍微延长，让音连绵
      }
      currentTime += duration;
    });

    // 循环
    const totalDuration = HAPPY_BIRTHDAY.reduce((sum, [_, beats]) => sum + beats, 0) * beatDuration;
    if (loop) {
      bgmTimer = setTimeout(playMelody, (totalDuration + 0.5) * 1000); // 句尾留白
    }
  }

  playMelody();
}

function stopBGM() {
  bgmStopFlag = true;
  if (bgmTimer) {
    clearTimeout(bgmTimer);
    bgmTimer = null;
  }
}

window.playHappyBirthday = playHappyBirthday;
window.stopBGM = stopBGM;

function playGiftOpen() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  [880, 1108, 1318, 1760].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, now + i * 0.08);
    gain.gain.linearRampToValueAtTime(0.2, now + i * 0.08 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.5);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now + i * 0.08);
    osc.stop(now + i * 0.08 + 0.5);
  });
}

function playFireworkBoom() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;

  // 烟花：以"噼里啪啦"为主，轻"咝"声背景，无低频鼓声

  // 1. 轻微的"咝"——火药燃烧背景（带通，中高频）
  const burnSize = ctx.sampleRate * 0.8;
  const burnBuffer = ctx.createBuffer(1, burnSize, ctx.sampleRate);
  const burnData = burnBuffer.getChannelData(0);
  for (let i = 0; i < burnSize; i++) {
    burnData[i] = (Math.random() * 2 - 1);
  }
  const burnNoise = ctx.createBufferSource();
  burnNoise.buffer = burnBuffer;
  const burnFilter = ctx.createBiquadFilter();
  burnFilter.type = 'bandpass';
  burnFilter.frequency.value = 4000;
  burnFilter.Q.value = 0.5;
  const burnGain = ctx.createGain();
  burnGain.gain.setValueAtTime(0.08, now);
  burnGain.gain.linearRampToValueAtTime(0.06, now + 0.05);
  burnGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
  burnNoise.connect(burnFilter);
  burnFilter.connect(burnGain);
  burnGain.connect(ctx.destination);
  burnNoise.start(now);
  burnNoise.stop(now + 0.8);
}

let candleNoise = null;
function startCandleSound() {
  const ctx = getAudioCtx();
  const bufferSize = ctx.sampleRate * 2;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);

  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.value = 1200 + Math.random() * 400;
  gain.gain.setValueAtTime(0.04, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.05);
}

function playBlowSound() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const bufferSize = ctx.sampleRate * 1.5;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800, now);
  filter.frequency.linearRampToValueAtTime(400, now + 1.5);
  filter.Q.value = 2;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.2, now + 0.1);
  gain.gain.linearRampToValueAtTime(0.18, now + 0.8);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  noise.start(now);
  noise.stop(now + 1.5);
}

function playCandleOut() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(200, now);
  osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
  gain.gain.setValueAtTime(0.12, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.2);
}

// 烟花粒子（3D 版本：球形爆炸，X/Y/Z 三轴发散 + 重力 + 衰减）
const FW_MAX = 2000;   // 最大粒子数（预分配容量，全局共享）
const particles = [];
const fwColors = ['#ff6b9d', '#feca57', '#48dbfb', '#ff9ff3', '#ffd700', '#ffffff', '#a29bfe', '#1dd1a1'];
const fwColors3D = [0xff6b9d, 0xfeca57, 0x48dbfb, 0xff9ff3, 0xffd700, 0xffffff, 0xa29bfe, 0x1dd1a1];

// 2D 屏幕坐标 → 3D 世界坐标（烟花在蛋糕周围的立体空间）
function screenTo3D(sx, sy) {
  const w = canvas.width, h = canvas.height;
  const nx = (sx / w - 0.5) * 2;
  const ny = (sy / h - 0.5) * 2;
  return {
    x: nx * 11,
    y: -ny * 7 + 2.5,
    z: (Math.random() - 0.5) * 4
  };
}

function launchFirework(x, y) {
  const pos = screenTo3D(x, y);
  const colorIdx = Math.floor(Math.random() * fwColors3D.length);
  const count = 70;
  for (let i = 0; i < count; i++) {
    // 球形发散：用球面坐标随机方向
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const speed = Math.random() * 0.10 + 0.05;   // 3D 速度（降低，爆炸更紧凑可见）
    particles.push({
      x: pos.x, y: pos.y, z: pos.z,
      vx: Math.sin(phi) * Math.cos(theta) * speed,
      vy: Math.cos(phi) * speed + 0.03,   // 略微向上初速
      vz: Math.sin(phi) * Math.sin(theta) * speed,
      color: Math.random() > 0.3 ? fwColors3D[colorIdx] : fwColors3D[Math.floor(Math.random() * fwColors3D.length)],
      pSize: Math.random() * 1.8 + 0.7,   // 每粒子独立大小（0.7~2.5）
      life: 1,
      decay: Math.random() * 0.004 + 0.002   // 大幅减慢衰减（停留更久，看得见降落）
    });
  }
  playFireworkBoom();
}

// 随机放一朵烟花（位置随机）
function launchRandomFirework() {
  launchFirework(
    Math.random() * canvas.width * 0.8 + canvas.width * 0.1,
    Math.random() * canvas.height * 0.5 + canvas.height * 0.1
  );
}

// 随机烟花调度器：模拟真实烟花——多发齐放 + 随机间隔（有时连发密集，有时停顿）
function startRandomFireworks() {
  stopRandomFireworks();
  function schedule() {
    // 每轮随机发 1~3 朵（多发齐放，位置略有错开）
    const burst = Math.floor(Math.random() * 3) + 1;
    for (let i = 0; i < burst; i++) {
      setTimeout(launchRandomFirework, i * (80 + Math.random() * 120));  // 80~200ms 错开发射
    }
    // 下一轮的随机间隔：500~2200ms（节奏不规律）
    const nextDelay = 500 + Math.random() * 1700;
    window._fwTimeout = setTimeout(schedule, nextDelay);
  }
  schedule();
}

function stopRandomFireworks() {
  if (window._fwTimeout) { clearTimeout(window._fwTimeout); window._fwTimeout = null; }
  if (window._fwInterval) { clearInterval(window._fwInterval); window._fwInterval = null; }
}

// 等距投影：把3D坐标转2D
function project(x, y, z, cx, cy, scale) {
  // 简单的等距投影
  const isoX = (x - z) * 0.866;  // cos(30°)
  const isoY = (x + z) * 0.5 - y; // sin(30°)
  return {
    x: cx + isoX * scale,
    y: cy - isoY * scale
  };
}

// 画椭圆（用于蛋糕的圆面）
function drawEllipse(cx, cy, rx, ry, fillStyle, strokeStyle) {
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  if (fillStyle) {
    ctx.fillStyle = fillStyle;
    ctx.fill();
  }
  if (strokeStyle) {
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// ============================================================
// Three.js 真 3D 蛋糕系统（与 2D 场景并存，透明背景叠加）
// ============================================================
let cake3D = null;  // { scene, camera, renderer, cakeGroup, candleObjs, flameLights }

// 初始化 3D 场景（仅执行一次）
function initCake3D() {
  if (cake3D || typeof THREE === 'undefined') return;

  const container = document.getElementById('cake-3d');
  const w = vw();
  const h = vh();

  const scene = new THREE.Scene();
  // 根据屏幕宽高比动态调整 FOV：竖屏手机（宽<高）用更大 FOV 确保蛋糕完整显示
  const aspect = w / h;
  // 竖屏：用较窄 FOV + 近距离，让蛋糕充满画面（而非远观变小）
  const fov = aspect < 0.8 ? 48 : (aspect < 1.2 ? 48 : 40);
  const camera = new THREE.PerspectiveCamera(fov, aspect, 0.1, 100);
  const camDist = aspect < 0.8 ? 27 : 18;
  const camY = aspect < 0.8 ? 7.5 : 5.5;
  camera.position.set(0, camY, camDist);   // 轻微俯视角度
  camera.lookAt(0, 0.8, 0);                // 视点对准蛋糕中部（略上移含蛋糕架）

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);   // 透明背景，让 2D 背景透出
  container.appendChild(renderer.domElement);

  // ===== Bloom 发光后处理（让蜡烛火焰/烟花/星星真实发光） =====
  // 温和参数：低强度 + 适中阈值，只让自发光元素发光，普通物体基本不受影响
  let composer = null;
  if (typeof THREE.EffectComposer !== 'undefined') {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    const bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(w, h),
      0.35,   // strength：发光强度（大幅降低，避免过曝）
      0.3,    // radius：光晕扩散半径（收窄）
      0.95    // threshold：极高，只有火焰白核/烟花中心这种极亮元素才发光
    );
    composer.addPass(bloomPass);
    composer.setSize(w, h);
  }

  // ===== 光照（恢复到能看清蛋糕的亮度，Bloom 用高 threshold 控制发光） =====
  scene.add(new THREE.AmbientLight(0xfff0e0, 0.4));                     // 暖色环境光（微降）
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.65);          // 主光（顶前，微降）
  keyLight.position.set(4, 8, 6);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xff9ecd, 0.24);         // 粉色补光（微降）
  fillLight.position.set(-5, 2, 3);
  scene.add(fillLight);

  // ===== 3D 星空（替换原 CSS 星点，带 Z 深度产生视差） =====
  const starCount = 400;
  const starPos = new Float32Array(starCount * 3);
  const starColor = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    // 球形分布，远近距离都有（产生深度视差）
    const r = 30 + Math.random() * 40;       // 半径 30~70，远离蛋糕
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    starPos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) + 10;  // 整体上移，多在上半空
    starPos[i * 3 + 2] = r * Math.cos(phi);
    // 星星颜色：白色为主，少量偏蓝/偏黄
    const tint = Math.random();
    if (tint < 0.7) { starColor[i*3]=1; starColor[i*3+1]=1; starColor[i*3+2]=1; }
    else if (tint < 0.85) { starColor[i*3]=0.8; starColor[i*3+1]=0.9; starColor[i*3+2]=1; }
    else { starColor[i*3]=1; starColor[i*3+1]=0.95; starColor[i*3+2]=0.8; }
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.Float32BufferAttribute(starColor, 3));
  // 生成圆形发光纹理（默认方形粒子 → 圆形发光点）
  const starTexCanvas = document.createElement('canvas');
  starTexCanvas.width = 64; starTexCanvas.height = 64;
  const stCtx = starTexCanvas.getContext('2d');
  const stGrad = stCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
  stGrad.addColorStop(0, 'rgba(255,255,255,1)');
  stGrad.addColorStop(0.3, 'rgba(255,255,255,0.7)');
  stGrad.addColorStop(1, 'rgba(255,255,255,0)');
  stCtx.fillStyle = stGrad;
  stCtx.fillRect(0, 0, 64, 64);
  const starTexture = new THREE.Texture(starTexCanvas);
  starTexture.needsUpdate = true;
  const starMat = new THREE.PointsMaterial({
    size: 1.0, sizeAttenuation: true, vertexColors: true,
    transparent: true, opacity: 0.95, map: starTexture,
    depthWrite: false, blending: THREE.AdditiveBlending   // 加法混合，重叠更亮
  });
  const starField = new THREE.Points(starGeo, starMat);
  scene.add(starField);

  // ===== 3D 狮子座星座（星点 + 连线，整体放在左前上方） =====
  const leoGroup = new THREE.Group();
  // 根据屏幕宽高比调整位置和大小（竖屏/横屏/电脑端各自适配）
  if (aspect < 0.8) {
    leoGroup.position.set(-3, 8, 1);     // 竖屏手机：偏左上方
    leoGroup.scale.setScalar(3.8);
  } else if (aspect < 1.2) {
    leoGroup.position.set(-5, 5, 2);     // 方屏/平板
    leoGroup.scale.setScalar(2.8);
  } else {
    leoGroup.position.set(-5.5, 4.5, 3); // 横屏电脑：左前方
    leoGroup.scale.setScalar(2.8);
  }
  // 星点：2D 归一化坐标映射到 3D（以中心为原点，y 翻转）
  const leoCx = 0.295, leoCy = 0.26, leoSc = 4;
  const leoStarPos = new Float32Array(LEO_STARS.length * 3);
  LEO_STARS.forEach((s, i) => {
    leoStarPos[i*3]   = (s.x - leoCx) * leoSc;
    leoStarPos[i*3+1] = -(s.y - leoCy) * leoSc * 0.8;
    leoStarPos[i*3+2] = 0;
  });
  const leoStarGeo = new THREE.BufferGeometry();
  leoStarGeo.setAttribute('position', new THREE.Float32BufferAttribute(leoStarPos, 3));
  const leoStarSizeArr = new Float32Array(LEO_STARS.length);
  LEO_STARS.forEach((s, i) => { leoStarSizeArr[i] = s.mag * 2; });
  leoStarGeo.setAttribute('aSize', new THREE.Float32BufferAttribute(leoStarSizeArr, 1));
  // 星座连线
  const leoLinePos = [];
  LEO_LINES.forEach(([a, b]) => {
    leoLinePos.push(leoStarPos[a*3], leoStarPos[a*3+1], leoStarPos[a*3+2]);
    leoLinePos.push(leoStarPos[b*3], leoStarPos[b*3+1], leoStarPos[b*3+2]);
  });
  const leoLineGeo = new THREE.BufferGeometry();
  leoLineGeo.setAttribute('position', new THREE.Float32BufferAttribute(leoLinePos, 3));
  const leoLineMat = new THREE.LineBasicMaterial({
    color: 0x96c8ff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const leoLines3D = new THREE.LineSegments(leoLineGeo, leoLineMat);
  leoGroup.add(leoLines3D);
  // 星点材质（ShaderMaterial 支持独立大小 + 圆形纹理）
  const leoStarMat = new THREE.ShaderMaterial({
    uniforms: { uTex: { value: starTexture } },
    vertexShader: [
      'attribute float aSize;',
      'void main() {',
      '  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);',
      '  gl_PointSize = aSize * (300.0 / -mvPosition.z);',
      '  gl_Position = projectionMatrix * mvPosition;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D uTex;',
      'void main() {',
      '  vec4 tex = texture2D(uTex, gl_PointCoord);',
      '  gl_FragColor = vec4(1.0, 1.0, 1.0, 1.0) * tex;',   // 白色星点 × 纹理
      '}'
    ].join('\n'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  const leoStars3D = new THREE.Points(leoStarGeo, leoStarMat);
  leoStars3D.material.opacity = 0;
  leoGroup.add(leoStars3D);
  // leoGroup 初始隐藏，随 leoOpacity 渐显
  leoStars3D.visible = false;
  leoLines3D.visible = false;
  scene.add(leoGroup);

  // ===== 3D 烟花粒子系统（复用星空圆形纹理，FW_MAX 为全局常量） =====
  const fwPosArr = new Float32Array(FW_MAX * 3);
  const fwColArr = new Float32Array(FW_MAX * 3);
  const fwSizeArr = new Float32Array(FW_MAX);
  const fwGeo = new THREE.BufferGeometry();
  fwGeo.setAttribute('position', new THREE.Float32BufferAttribute(fwPosArr, 3));
  fwGeo.setAttribute('color', new THREE.Float32BufferAttribute(fwColArr, 3));
  fwGeo.setAttribute('aSize', new THREE.Float32BufferAttribute(fwSizeArr, 1));   // 每粒子独立大小
  fwGeo.setDrawRange(0, 0);   // 初始画 0 个
  // 自定义着色器：支持每粒子独立大小 + 圆形发光纹理 + 加法混合
  const fwMat = new THREE.ShaderMaterial({
    uniforms: { uTex: { value: starTexture } },
    vertexShader: [
      'attribute float aSize;',
      'attribute vec3 color;',
      'varying vec3 vColor;',
      'void main() {',
      '  vColor = color;',
      '  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);',
      '  gl_PointSize = aSize * (300.0 / -mvPosition.z);',   // 透视衰减
      '  gl_Position = projectionMatrix * mvPosition;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D uTex;',
      'varying vec3 vColor;',
      'void main() {',
      '  vec4 tex = texture2D(uTex, gl_PointCoord);',
      '  gl_FragColor = vec4(vColor, 1.0) * tex;',   // 纹理圆形 + 顶点颜色
      '}'
    ].join('\n'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  const fireworkField = new THREE.Points(fwGeo, fwMat);
  scene.add(fireworkField);

  // ===== 蛋糕组 =====
  const cakeGroup = new THREE.Group();
  scene.add(cakeGroup);

  // 蛋糕架（高脚台：底座圆锥台 + 立柱+装饰球 + 波浪荷叶边顶盘）
  const standMat = new THREE.MeshStandardMaterial({
    color: 0xfaf7f2, metalness: 0.3, roughness: 0.25   // 珍珠白（降低粗糙度，更光滑的瓷器光泽）
  });
  const goldMat = new THREE.MeshStandardMaterial({
    color: 0xd4af37, metalness: 0.85, roughness: 0.25, emissive: 0x2a2008   // 金色描边
  });

  // === 底座（扁圆锥台，稳重） ===
  const base = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.8, 0.6, 64), standMat);
  base.position.y = -3.0;
  cakeGroup.add(base);
  // 底座顶部金色细圈
  const baseRimGeo = new THREE.TorusGeometry(3.2, 0.05, 10, 48);
  baseRimGeo.rotateX(Math.PI / 2);
  const baseRim = new THREE.Mesh(baseRimGeo, goldMat);
  baseRim.position.y = -2.7;
  cakeGroup.add(baseRim);

  // === 立柱（细圆柱，抬高顶盘） ===
  const column = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 2.4, 32), standMat);
  column.position.y = -1.5;
  cakeGroup.add(column);
  // 立柱中部装饰球（精致感）
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.85, 24, 24), standMat);
  knob.position.y = -1.5;
  cakeGroup.add(knob);

  // === 顶盘（荷叶边：边缘上下起伏，用自定义 BufferGeometry 手动控制顶点高度） ===
  // 核心原理：圆盘半径固定，但最外圈顶点的 Y 高度随 cos(波瓣数×角度) 上下波动 → 荷叶边
  const LF_RINGS = 15;           // 同心环数（内→外，增多让径向更平滑）
  const LF_SEGS = 192;           // 角度分段（增多让边缘更圆润）
  const LF_R_INNER = 3.4;        // 内圈半径（承托蛋糕，保持平）
  const LF_R_OUTER = 4.6;        // 外圈半径（荷叶边外缘）
  const LF_WAVE_COUNT = 28;      // 波瓣数（增多→波纹更密更圆润）
  const LF_WAVE_AMP = 0.17;      // 上下起伏幅度（更柔和圆润）
  const LF_THICK = 0.18;         // 盘子厚度（上下面距离）

  // 计算某环某角度的 Y 高度（全程平滑渐变，无折角）
  function lfRingY(ringT, theta) {
    // 用 4 次方曲线让起伏集中在最外圈，内圈几乎为 0，过渡完全平滑
    const fade = Math.pow(Math.max(0, ringT - 0.45) / 0.55, 2.5);   // 0→1 平滑渐显
    return LF_WAVE_AMP * fade * Math.cos(LF_WAVE_COUNT * theta);
  }

  // 荷叶边专用材质：DoubleSide 双面渲染，flatShading 让起伏棱面更清晰
  const leafMat = new THREE.MeshStandardMaterial({
    color: 0xfaf7f2, metalness: 0.3, roughness: 0.25,
    side: THREE.DoubleSide, flatShading: false
  });

  // 构建单层带厚度的荷叶边：每个顶点位置分上下两面，用侧面连接
  const pos = [], idx = [];
  // 第一段：上表面所有顶点（ring × seg）
  for (let ring = 0; ring < LF_RINGS; ring++) {
    const ringT = ring / (LF_RINGS - 1);
    const r = LF_R_INNER + (LF_R_OUTER - LF_R_INNER) * ringT;
    for (let seg = 0; seg < LF_SEGS; seg++) {
      const theta = (seg / LF_SEGS) * Math.PI * 2;
      const x = r * Math.cos(theta);
      const z = r * Math.sin(theta);
      const y = lfRingY(ringT, theta) + LF_THICK / 2;   // 上表面
      pos.push(x, y, z);
    }
  }
  // 第二段：下表面所有顶点
  for (let ring = 0; ring < LF_RINGS; ring++) {
    const ringT = ring / (LF_RINGS - 1);
    const r = LF_R_INNER + (LF_R_OUTER - LF_R_INNER) * ringT;
    for (let seg = 0; seg < LF_SEGS; seg++) {
      const theta = (seg / LF_SEGS) * Math.PI * 2;
      const x = r * Math.cos(theta);
      const z = r * Math.sin(theta);
      const y = lfRingY(ringT, theta) - LF_THICK / 2;   // 下表面（同起伏）
      pos.push(x, y, z);
    }
  }
  const total = LF_RINGS * LF_SEGS;   // 单面顶点数
  // 上表面三角形（正面朝上）
  for (let ring = 0; ring < LF_RINGS - 1; ring++) {
    for (let seg = 0; seg < LF_SEGS; seg++) {
      const a = ring * LF_SEGS + seg;
      const b = ring * LF_SEGS + (seg + 1) % LF_SEGS;
      const c = (ring + 1) * LF_SEGS + seg;
      const d = (ring + 1) * LF_SEGS + (seg + 1) % LF_SEGS;
      idx.push(a, c, b, b, c, d);
    }
  }
  // 下表面三角形（正面朝下，反向绕序）
  for (let ring = 0; ring < LF_RINGS - 1; ring++) {
    for (let seg = 0; seg < LF_SEGS; seg++) {
      const a = total + ring * LF_SEGS + seg;
      const b = total + ring * LF_SEGS + (seg + 1) % LF_SEGS;
      const c = total + (ring + 1) * LF_SEGS + seg;
      const d = total + (ring + 1) * LF_SEGS + (seg + 1) % LF_SEGS;
      idx.push(a, b, c, b, d, c);
    }
  }
  // 外缘侧面（连接最外环的上下表面，形成厚度边缘）
  const outerRing = LF_RINGS - 1;
  for (let seg = 0; seg < LF_SEGS; seg++) {
    const segNext = (seg + 1) % LF_SEGS;
    const upA = outerRing * LF_SEGS + seg;
    const upB = outerRing * LF_SEGS + segNext;
    const dnA = total + outerRing * LF_SEGS + seg;
    const dnB = total + outerRing * LF_SEGS + segNext;
    idx.push(upA, dnA, upB, upB, dnA, dnB);
  }

  const leafGeo = new THREE.BufferGeometry();
  leafGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  leafGeo.setIndex(idx);
  leafGeo.computeVertexNormals();
  const leafPlate = new THREE.Mesh(leafGeo, leafMat);
  leafPlate.position.y = -0.1;
  cakeGroup.add(leafPlate);

  // 盘面内凹（承托蛋糕的平面，盖在内圈上方）
  const well = new THREE.Mesh(
    new THREE.CylinderGeometry(3.4, 3.5, 0.1, 64),
    new THREE.MeshStandardMaterial({ color: 0xf2eee6, metalness: 0.25, roughness: 0.28 })
  );
  well.position.y = -0.02;
  cakeGroup.add(well);

  // 三层蛋糕参数 [半径, 高度, 颜色]
  const layers = [
    { r: 3.4, h: 1.6, color: 0xff7eb9 },   // 底层 粉
    { r: 2.5, h: 1.3, color: 0xfff0f5 },   // 中层 奶油白
    { r: 1.7, h: 1.1, color: 0xfeca57 }    // 顶层 暖黄
  ];
  let layerTopY = 0;   // 逐层累加高度
  const layerTopYs = [];

  // ===== 水果材质与生成函数（三层花边各用不同水果） =====
  const fruitMat = {
    red: new THREE.MeshStandardMaterial({ color: 0xe83232, roughness: 0.4 }),
    redDark: new THREE.MeshStandardMaterial({ color: 0xb8201e, roughness: 0.5 }),
    green: new THREE.MeshStandardMaterial({ color: 0x4caf3f, roughness: 0.5 }),
    greenDark: new THREE.MeshStandardMaterial({ color: 0x2e7d2a, roughness: 0.5 }),
    brown: new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.6 }),
    white: new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.4 }),
    durianShell: new THREE.MeshStandardMaterial({ color: 0xb5a830, roughness: 0.7 }),
    durianSpike: new THREE.MeshStandardMaterial({ color: 0x8a7d1e, roughness: 0.6 }),
    kiwiSeed: new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.4 }),
  };
  // 草莓
  // 草莓（LatheGeometry 旋转圆润水滴轮廓 + 绿叶冠 + 籽点）
  function makeStrawberry() {
    const g = new THREE.Group();
    // 草莓轮廓：上宽下窄的圆润曲线（从顶到底）
    const profile = [];
    for (let k = 0; k <= 18; k++) {
      const t = k / 18;            // 0(顶) ~ 1(底)
      const py = (1 - t) * 0.34;   // 高度 0.34（放大）
      // 半径：顶部收口、上中部最宽、底部尖
      let pr;
      if (t < 0.15) pr = 0.10 * Math.sqrt(t / 0.15);          // 顶部颈
      else if (t < 0.55) pr = 0.16 * (1 - (t - 0.15) * 0.15); // 上中部最宽（放大）
      else { const tt = (t - 0.55) / 0.45; pr = 0.15 * (1 - tt * tt); }  // 底部收尖
      profile.push(new THREE.Vector2(pr, py));
    }
    const bodyGeo = new THREE.LatheGeometry(profile, 18);
    const body = new THREE.Mesh(bodyGeo, fruitMat.red);
    g.add(body);
    // 绿色叶冠（顶部展开的星形叶）
    for (let l = 0; l < 6; l++) {
      const la = (l / 6) * Math.PI * 2;
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.09, 4), fruitMat.green);
      leaf.position.set(Math.cos(la) * 0.07, 0.27, Math.sin(la) * 0.07);
      leaf.rotation.z = Math.cos(la) * 0.6;
      leaf.rotation.x = Math.sin(la) * 0.6;
      g.add(leaf);
    }
    // 籽点（黄色小点，分布在草莓表面）
    for (let s = 0; s < 14; s++) {
      const sa = Math.random() * Math.PI * 2;
      const sy = 0.05 + Math.random() * 0.22;
      const t = sy / 0.34;
      let sr;
      if (t < 0.15) sr = 0.08;
      else if (t < 0.55) sr = 0.12;
      else sr = 0.12 * (1 - (t - 0.55) / 0.45);
      const seed = new THREE.Mesh(new THREE.SphereGeometry(0.014, 6, 6), fruitMat.kiwiSeed);
      seed.position.set(Math.cos(sa) * sr * 0.95, sy, Math.sin(sa) * sr * 0.95);
      g.add(seed);
    }
    return g;
  }
  // 樱桃
  function makeCherry() {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.10, 16, 16), fruitMat.redDark);
    body.position.y = 0.08; body.scale.y = 0.95; g.add(body);
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), fruitMat.white);
    hl.position.set(0.04, 0.12, 0.07); g.add(hl);
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.14, 6), fruitMat.brown);
    stem.position.set(0.01, 0.22, 0); stem.rotation.z = 0.2; g.add(stem);
    return g;
  }
  // 猕猴桃片
  function makeKiwiSlice() {
    const g = new THREE.Group();
    const skin = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.04, 24), fruitMat.greenDark);
    skin.rotation.x = Math.PI / 2; g.add(skin);
    const flesh = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.045, 24), fruitMat.green);
    flesh.rotation.x = Math.PI / 2; g.add(flesh);
    const core = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.05, 16), fruitMat.white);
    core.rotation.x = Math.PI / 2; g.add(core);
    for (let s = 0; s < 12; s++) {
      const sa = (s / 12) * Math.PI * 2;
      const seed = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 6), fruitMat.kiwiSeed);
      seed.position.set(Math.cos(sa) * 0.09, Math.sin(sa) * 0.09, 0.03); g.add(seed);
    }
    g.rotation.x = -0.3;
    return g;
  }
  // 剥好的榴莲果肉（带尖端的蒜瓣形长椭圆体 + 纵向纤维凹槽）
  function makeDurian() {
    const g = new THREE.Group();
    // 果肉材质：奶黄色，略带光泽（软糯奶油感）
    const fleshMat = new THREE.MeshStandardMaterial({ color: 0xfff4b8, roughness: 0.4 });
    // 用 LatheGeometry 做蒜瓣形轮廓：底部圆、中部胖、顶部收尖
    const profile = [];
    for (let k = 0; k <= 14; k++) {
      const t = k / 14;            // 0(底) ~ 1(顶)
      const py = t * 0.3;          // 高度
      let pr;
      if (t < 0.2) pr = 0.12 * Math.sqrt(t / 0.2);        // 底部圆弧
      else if (t < 0.7) pr = 0.13 * (1 - (t - 0.2) * 0.2); // 中部最胖
      else { const tt = (t - 0.7) / 0.3; pr = 0.115 * (1 - tt * tt); }  // 顶部收尖
      profile.push(new THREE.Vector2(pr, py));
    }
    const bodyGeo = new THREE.LatheGeometry(profile, 16);
    const body = new THREE.Mesh(bodyGeo, fleshMat);
    body.position.y = 0.02;
    g.add(body);
    // 纵向纤维凹槽（几条细线沿表面纵向走，模拟榴莲肉纤维）
    const grooveMat = new THREE.MeshStandardMaterial({ color: 0xe6d068, roughness: 0.5 });
    for (let v = 0; v < 5; v++) {
      const va = (v / 5) * Math.PI * 2;
      const groove = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.22, 5), grooveMat);
      groove.position.set(Math.cos(va) * 0.1, 0.16, Math.sin(va) * 0.1);
      // 略微向中心倾斜（贴合表面）
      groove.rotation.z = Math.cos(va) * 0.3;
      groove.rotation.x = Math.sin(va) * 0.3;
      g.add(groove);
    }
    // 顶部小尖（榴莲肉顶端常有个小尖头）
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.06, 6), fleshMat);
    tip.position.y = 0.33;
    g.add(tip);
    return g;
  }
  // 三层各用一种水果：底层草莓 / 中层樱桃 / 顶层猕猴桃片（榴莲点缀顶层）
  const layerFruitMaker = [makeStrawberry, makeCherry, makeKiwiSlice];

  layers.forEach((L, idx) => {
    const geo = new THREE.CylinderGeometry(L.r, L.r, L.h, 64);
    const mat = new THREE.MeshStandardMaterial({
      color: L.color, roughness: 0.75, metalness: 0.0
    });
    const mesh = new THREE.Mesh(geo, mat);
    const cy = layerTopY + L.h / 2;
    mesh.position.y = cy;
    cakeGroup.add(mesh);

    // 顶面奶油层（略亮的同色薄圆盘）
    const creamGeo = new THREE.CylinderGeometry(L.r * 1.01, L.r * 1.01, 0.12, 64);
    const creamMat = new THREE.MeshStandardMaterial({
      color: idx === 1 ? 0xffd9ec : 0xfff5e8, roughness: 0.5
    });
    const cream = new THREE.Mesh(creamGeo, creamMat);
    cream.position.y = layerTopY + L.h + 0.06;
    cakeGroup.add(cream);

    // 水果花边（替换奶油球，每层不同水果：草莓/樱桃/猕猴桃片）
    const beadCount = Math.floor(L.r * 4);
    for (let i = 0; i < beadCount; i++) {
      const a = (i / beadCount) * Math.PI * 2;
      const fruit = layerFruitMaker[idx]();
      fruit.position.set(Math.cos(a) * L.r, layerTopY + L.h + 0.12, Math.sin(a) * L.r);
      fruit.scale.setScalar(1.0);
      // 随机倾斜（草莓尤其要横放/斜放，不全竖插）
      fruit.rotation.y = a + (Math.random() - 0.5) * 1.5;
      fruit.rotation.x = (Math.random() - 0.5) * 1.2;   // 前后倾斜
      fruit.rotation.z = (Math.random() - 0.5) * 1.2;   // 左右倾斜（横放）
      cakeGroup.add(fruit);
    }

    layerTopY += L.h + 0.12;
    layerTopYs.push(layerTopY);
  });

  // （水果材质与生成函数已移至 layers.forEach 之前定义）

  // ===== 卡通小牛（生肖装饰，站在蜡烛右侧） =====
  const cow = new THREE.Group();
  const cowWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
  const cowPink = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.5 });
  const cowBrown = new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.6 });
  const cowHorn = new THREE.MeshStandardMaterial({ color: 0xf5deb3, roughness: 0.4 });
  const cowBlack = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
  // 身体（扁椭球）
  const cowBody = new THREE.Mesh(new THREE.SphereGeometry(0.45, 20, 20), cowWhite);
  cowBody.scale.set(1, 0.7, 0.6);
  cowBody.position.y = 0.4;
  cow.add(cowBody);
  // 棕色斑点
  for (let si = 0; si < 4; si++) {
    const sa = si * 1.7;
    const spot = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 10), cowBrown);
    spot.scale.set(1, 0.3, 1);
    spot.position.set(Math.cos(sa) * 0.32, 0.45, Math.sin(sa) * 0.22);
    cow.add(spot);
  }
  // 头（圆球，在身体前上方）
  const cowHead = new THREE.Mesh(new THREE.SphereGeometry(0.3, 20, 20), cowWhite);
  cowHead.position.set(0.38, 0.82, 0);
  cow.add(cowHead);
  // 角（两个小圆锥）
  const hornGeo = new THREE.ConeGeometry(0.05, 0.2, 8);
  const horn1 = new THREE.Mesh(hornGeo, cowHorn);
  horn1.position.set(0.42, 1.08, 0.13); horn1.rotation.z = -0.3;
  cow.add(horn1);
  const horn2 = new THREE.Mesh(hornGeo, cowHorn);
  horn2.position.set(0.42, 1.08, -0.13); horn2.rotation.z = -0.3;
  cow.add(horn2);
  // 耳朵（两个扁椭球）
  const earGeo = new THREE.SphereGeometry(0.1, 10, 10);
  const ear1 = new THREE.Mesh(earGeo, cowPink);
  ear1.scale.set(0.6, 1, 1.5); ear1.position.set(0.35, 0.88, 0.27);
  cow.add(ear1);
  const ear2 = new THREE.Mesh(earGeo, cowPink);
  ear2.scale.set(0.6, 1, 1.5); ear2.position.set(0.35, 0.88, -0.27);
  cow.add(ear2);
  // 眼睛（两个小黑点）
  const eyeGeo = new THREE.SphereGeometry(0.035, 8, 8);
  const eye1 = new THREE.Mesh(eyeGeo, cowBlack); eye1.position.set(0.62, 0.88, 0.1);
  cow.add(eye1);
  const eye2 = new THREE.Mesh(eyeGeo, cowBlack); eye2.position.set(0.62, 0.88, -0.1);
  cow.add(eye2);
  // 鼻子（粉色扁球）
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), cowPink);
  nose.scale.set(0.8, 0.8, 1); nose.position.set(0.65, 0.78, 0);
  cow.add(nose);
  // 四条腿（短圆柱）
  const legGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.22, 8);
  const legPos = [[0.2, 0.2], [0.2, -0.2], [-0.18, 0.2], [-0.18, -0.2]];
  legPos.forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(legGeo, cowWhite);
    leg.position.set(lx, 0.11, lz);
    cow.add(leg);
  });
  cow.scale.setScalar(0.5);
  // 放在两根蜡烛(1和8)中间的正前方（x=0，z 朝相机），顶层顶面
  cow.position.set(0, layerTopYs[2], 1.0);
  cow.rotation.y = -1.4;   // 朝外（头朝相机方向），略带倾斜角度
  cakeGroup.add(cow);

  // ===== 蜡烛（数字 18 的两根蜡烛，用 Shape + ExtrudeGeometry 建模）=====
  const candleColors3D = [0xff9ff3, 0x48dbfb];
  const candleObjs = [];   // 每项: { group, flame, light, idx }
  const candleBaseY = layerTopYs[2];   // 蜡烛立在顶层顶面

  // 构建数字 "1" 的 Shape（手写体：单纯一条竖线，略斜，无顶部斜钩，上下略粗模拟笔触）
  function buildDigit1() {
    const s = new THREE.Shape();
    const h = 1.9, baseY = 0.15, topY = baseY + h;
    // 手写 1：一条略向右斜的竖线，上下端略宽（起笔/收笔），中段略细
    // 用贝塞尔让左右边线带轻微弧度
    const wb = 0.17, wt = 0.14, wm = 0.11;   // 底/顶/中 半宽
    const skew = 0.08;                         // 顶部右移量（斜度）
    s.moveTo(-wb, baseY);                      // 底左
    s.bezierCurveTo(-wm, baseY + h * 0.3, -wm + skew * 0.5, baseY + h * 0.6, -wt + skew, topY);  // 左边上行（略弧）
    s.lineTo(wt + skew, topY);                 // 顶右
    s.bezierCurveTo(wm + skew * 0.5, baseY + h * 0.6, wm, baseY + h * 0.3, wb, baseY);            // 右边下行（略弧）
    s.closePath();
    return s;
  }

  // 构建数字 "8" 的 Shape（圆润花生形：8段圆弧贝塞尔 + 两个内孔）
  function buildDigit8() {
    const s = new THREE.Shape();
    const topCY = 1.65, topR = 0.40, topInner = 0.19;
    const botCY = 0.73, botR = 0.58, botInner = 0.32;
    // 外轮廓：8 段圆弧贝塞尔（每段精确近似 90° 弧，非常圆润）
    s.moveTo(0, 0.150);
    s.bezierCurveTo(0.320,0.150, 0.580,0.410, 0.580,0.730);
    s.bezierCurveTo(0.580,1.050, 0.473,1.194, 0.166,1.286);
    s.bezierCurveTo(0.367,1.378, 0.400,1.429, 0.400,1.650);
    s.bezierCurveTo(0.400,1.871, 0.221,2.050, 0.000,2.050);
    s.bezierCurveTo(-0.221,2.050, -0.400,1.871, -0.400,1.650);
    s.bezierCurveTo(-0.400,1.429, -0.367,1.378, -0.166,1.286);
    s.bezierCurveTo(-0.473,1.194, -0.580,1.050, -0.580,0.730);
    s.bezierCurveTo(-0.580,0.410, -0.320,0.150, -0.000,0.150);
    s.closePath();
    // 内孔：上圆孔 + 下圆孔（让 8 是空心环）
    const holeTop = new THREE.Path();
    holeTop.absarc(0, topCY, topInner, 0, Math.PI * 2, true);
    s.holes.push(holeTop);
    const holeBot = new THREE.Path();
    holeBot.absarc(0, botCY, botInner, 0, Math.PI * 2, true);
    s.holes.push(holeBot);
    return s;
  }

  // 火焰几何体（泪滴形，复用）
  const flameProfile = [];
  for (let k = 0; k <= 16; k++) {
    const t = k / 16;
    const py = t * 1.0;
    let pr;
    if (t < 0.15) pr = 0.5 * Math.sqrt(t / 0.15);
    else if (t < 0.7) pr = 0.5 * (1 - (t - 0.15) * 0.3);
    else { const tt = (t - 0.7) / 0.3; pr = 0.42 * (1 - tt) * (1 - tt); }
    flameProfile.push(new THREE.Vector2(pr, py));
  }
  const teardropGeo = new THREE.LatheGeometry(flameProfile, 20);

  candles.forEach((c, i) => {
    const cgroup = new THREE.Group();
    cgroup.position.set(c.x * 3.0, candleBaseY, 0);

    // 数字蜡烛体（挤出成 3D）
    const digitShape = c.digit === '1' ? buildDigit1() : buildDigit8();
    const bodyGeo = new THREE.ExtrudeGeometry(digitShape, {
      depth: 0.28, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 2
    });
    const bodyMat = new THREE.MeshStandardMaterial({
      color: candleColors3D[i], roughness: 0.45
    });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.z = -0.14;   // 居中厚度
    cgroup.add(body);

    // 插棍（数字底部插入蛋糕的细木棍）
    const stickLen = 0.45;     // 棍长
    const stick = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, stickLen, 8),
      new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.8 })
    );
    stick.position.y = 0.15 - stickLen / 2;   // 从数字底部(0.15)向下延伸
    stick.position.z = -0.14;
    cgroup.add(stick);

    // 烛芯（数字顶部）
    const wickTopY = 2.05;   // 两个数字顶部齐平（数字1顶=2.05，数字8上圆顶=1.65+0.40=2.05）
    const wick = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02, 0.02, 0.14, 6),
      new THREE.MeshStandardMaterial({ color: 0x222222 })
    );
    wick.position.y = wickTopY;
    cgroup.add(wick);

    // 火焰组（泪滴形 + 点光源）
    const flame = new THREE.Group();
    flame.position.y = wickTopY + 0.16;
    const fOuter = new THREE.Mesh(
      teardropGeo,
      new THREE.MeshBasicMaterial({ color: 0xff7a00, transparent: true, opacity: 0.45, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    fOuter.scale.set(0.20, 0.32, 0.20);
    flame.add(fOuter);
    const fMid = new THREE.Mesh(
      teardropGeo,
      new THREE.MeshBasicMaterial({ color: 0xffc83a, transparent: true, opacity: 0.75, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    fMid.scale.set(0.14, 0.26, 0.14);
    fMid.position.y = 0.01;
    flame.add(fMid);
    const fCore = new THREE.Mesh(
      teardropGeo,
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    fCore.scale.set(0.08, 0.18, 0.08);
    fCore.position.y = 0.03;
    flame.add(fCore);
    cgroup.add(flame);

    // 点光源
    const light = new THREE.PointLight(0xffaa33, 0.8, 6, 2);
    light.position.y = wickTopY + 0.16;
    cgroup.add(light);

    cakeGroup.add(cgroup);
    candleObjs.push({ group: cgroup, flame, light, idx: i });
  });

  // 初始隐藏，等 cakeVisible 时再显示
  cakeGroup.visible = false;

  // ===== 鼠标拖拽旋转（简易，不依赖 OrbitControls）=====
  let dragging = false;
  let lastX = 0;
  let userRotY = 0;
  let dragMoved = false;   // 是否真正发生了拖拽移动（区分"点击"和"拖拽"）
  renderer.domElement.style.pointerEvents = 'auto';   // 仅 3D canvas 接收拖拽
  renderer.domElement.addEventListener('mousedown', (e) => {
    dragging = true; dragMoved = false; lastX = e.clientX;
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    if (Math.abs(dx) > 2) { dragMoved = true; autoRotate = false; }   // 只有真正移动才停旋转
    userRotY += dx * 0.01;
    lastX = e.clientX;
  });
  window.addEventListener('mouseup', () => {
    dragging = false;
    // 拖拽松开后，2 秒自动恢复旋转
    if (dragMoved) { clearTimeout(window._autoRotateTimer); window._autoRotateTimer = setTimeout(() => { autoRotate = true; }, 2000); }
  });
  // 触摸支持
  renderer.domElement.addEventListener('touchstart', (e) => {
    dragging = true; dragMoved = false; lastX = e.touches[0].clientX;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const dx = e.touches[0].clientX - lastX;
    if (Math.abs(dx) > 2) { dragMoved = true; autoRotate = false; }
    userRotY += dx * 0.01;
    lastX = e.touches[0].clientX;
  }, { passive: true });
  window.addEventListener('touchend', () => {
    dragging = false;
    if (dragMoved) { clearTimeout(window._autoRotateTimer); window._autoRotateTimer = setTimeout(() => { autoRotate = true; }, 2000); }
  });

  cake3D = { scene, camera, renderer, composer, cakeGroup, candleObjs, starField, fireworkField, leoStars3D, leoLines3D, leoGroup, userRotYRef: { v: userRotY } };

  // 窗口缩放
  window.addEventListener('resize', () => {
    if (!cake3D) return;
    const nw = vw(), nh = vh();
    const na = nw / nh;
    // 竖屏横屏切换时重新计算 FOV 和相机位置（手机旋转屏幕）
    cake3D.camera.fov = na < 0.8 ? 48 : (na < 1.2 ? 48 : 40);
    cake3D.camera.aspect = na;
    cake3D.camera.position.set(0, na < 0.8 ? 7.5 : 5.5, na < 0.8 ? 27 : 18);
    cake3D.camera.lookAt(0, 0.8, 0);
    cake3D.camera.updateProjectionMatrix();
    cake3D.renderer.setSize(nw, nh);
    if (cake3D.composer) cake3D.composer.setSize(nw, nh);
    // 狮子座位置随屏幕方向同步调整
    if (cake3D.leoGroup) {
      if (na < 0.8) {
        cake3D.leoGroup.position.set(-3, 8, 1);
        cake3D.leoGroup.scale.setScalar(3.8);
      } else if (na < 1.2) {
        cake3D.leoGroup.position.set(-5, 5, 2);
        cake3D.leoGroup.scale.setScalar(2.8);
      } else {
        cake3D.leoGroup.position.set(-5.5, 4.5, 3);
        cake3D.leoGroup.scale.setScalar(2.8);
      }
    }
  });
}

// 每帧更新 3D 蛋糕（由 animate() 调用）
function updateCake3D() {
  if (!cake3D) return;

  // 可见性 + 缩放跟随 cakeScale
  cake3D.cakeGroup.visible = cakeVisible;
  if (cakeVisible) {
    const s = cakeScale;
    cake3D.cakeGroup.scale.setScalar(s);
  }

  // 3D 星空：缓慢旋转产生视差深度感（独立于蛋糕旋转）
  if (cake3D.starField) {
    cake3D.starField.rotation.y += 0.0004;
    cake3D.starField.rotation.x += 0.00015;
  }

  // 3D 狮子座：渐显 + 每颗星独立呼吸 + 连线呼吸
  if (cake3D.leoStars3D && cakeVisible) {
    // 渐显（leoOpacity 在 drawLeo 里仍会增长，这里读取）
    if (leoOpacity < 0.6) leoOpacity += 0.003;
    const showLeo = leoOpacity > 0.01;
    cake3D.leoStars3D.visible = showLeo;
    cake3D.leoLines3D.visible = showLeo;
    // 每颗星独立呼吸：更新 aSize（大小随呼吸起伏，幅度加大让差异明显）
    const sizeAttr = cake3D.leoStars3D.geometry.attributes.aSize;
    LEO_STARS.forEach((s, i) => {
      const breathe = 0.6 + 0.4 * Math.sin(time * s.freq + s.phase);   // 0.6~1.0，最暗时仍有较亮底光
      sizeAttr.array[i] = s.mag * 2.5 * breathe * leoOpacity;
    });
    sizeAttr.needsUpdate = true;
    // 连线呼吸（透明度随整体缓慢呼吸）
    const lineBreathe = 0.5 + 0.5 * Math.sin(time * 0.4);
    cake3D.leoLines3D.material.opacity = (0.35 + lineBreathe * 0.45) * leoOpacity;
  } else if (cake3D.leoStars3D) {
    cake3D.leoStars3D.visible = false;
    cake3D.leoLines3D.visible = false;
  }

  // 自动旋转 / 用户拖拽
  if (autoRotate) {
    cakeRotY += 0.0012;
  }
  cake3D.cakeGroup.rotation.y = cakeRotY + cake3D.userRotYRef.v;

  // 蜡烛火焰更新（迁移原 4 分支动画逻辑）
  cake3D.candleObjs.forEach((obj, i) => {
    const c = candles[i];
    const showFlame = c.alive || (time - c.blownTime < 0.5);
    obj.flame.visible = showFlame;
    obj.light.visible = showFlame;

    if (!showFlame) return;

    let flameScale = 1;
    let flameOpacity = 1;
    let flameTilt = 0;

    if (!c.alive) {
      const progress = (time - c.blownTime) / 0.5;
      flameScale = Math.max(0.01, 1 - progress);
      flameOpacity = 1 - progress;
      obj.flame.position.y = 1.32 + progress * 0.3;   // 下沉
    } else if (blowState === 'wishing') {
      flameScale = 1 + Math.sin(time * 8 + i) * 0.15;
      flameTilt = Math.sin(time * 6 + i) * 0.2;
    } else if (blowState === 'blowing') {
      const progress = Math.min(1, (time - blowStartTime) / 1.0);
      const blowStrength = Math.sin(progress * Math.PI);
      flameScale = 1 + Math.sin(time * 15 + i) * 0.2;
      flameTilt = blowStrength * 0.8 + Math.sin(time * 20 + i) * 0.2;
    } else {
      flameScale = 1 + Math.sin(time * 7 + i) * 0.1;
      flameTilt = Math.sin(time * 5 + i) * 0.1;
    }

    obj.flame.scale.setScalar(flameScale);
    obj.flame.rotation.z = flameTilt * 0.4;
    obj.flame.children.forEach(m => { m.material.opacity *= flameOpacity; });
    obj.light.intensity = 0.8 * flameOpacity * flameScale;
  });

  // 渲染：优先用 Bloom 后处理（composer），无则回退普通渲染
  if (cake3D.composer) {
    cake3D.composer.render();
  } else {
    cake3D.renderer.render(cake3D.scene, cake3D.camera);
  }
}

// 画蛋糕（优先用 Three.js 3D；3D 可用时跳过 2D 绘制）
function drawCake() {
  if (!cakeVisible) return;
  if (cake3D) return;   // 3D 已接管，不再画 2D 蛋糕

  const cx = canvas.width / 2;
  const cy = canvas.height / 2 + 80;
  const scale = cakeScale * 80;

  ctx.save();

  // 阴影
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 40, 160 * cakeScale, 30 * cakeScale, 0, 0, Math.PI * 2);
  ctx.filter = 'blur(8px)';
  ctx.fill();
  ctx.filter = 'none';
  ctx.globalAlpha = 1;

  // 盘子
  const plateGrad = ctx.createLinearGradient(cx - 180, cy, cx + 180, cy);
  plateGrad.addColorStop(0, '#a0a0a8');
  plateGrad.addColorStop(0.5, '#e0e0e8');
  plateGrad.addColorStop(1, '#a0a0a8');
  drawEllipse(cx, cy + 10, 150 * cakeScale, 30 * cakeScale, plateGrad);
  drawEllipse(cx, cy + 6, 140 * cakeScale, 26 * cakeScale, '#c8c8d0');

  // 底层
  const bottomY = cy - 50;
  const bottomW = 130 * cakeScale;
  const bottomH = 70 * cakeScale;

  // 底层侧面
  const bGrad = ctx.createLinearGradient(cx - bottomW, bottomY, cx + bottomW, bottomY);
  bGrad.addColorStop(0, '#ff7eb9');
  bGrad.addColorStop(0.5, '#ff9ecd');
  bGrad.addColorStop(1, '#ff7eb9');
  ctx.fillStyle = bGrad;
  ctx.beginPath();
  ctx.moveTo(cx - bottomW, bottomY);
  ctx.lineTo(cx - bottomW, bottomY - bottomH);
  ctx.lineTo(cx + bottomW, bottomY - bottomH);
  ctx.lineTo(cx + bottomW, bottomY);
  ctx.ellipse(cx, bottomY, bottomW, 20 * cakeScale, 0, 0, Math.PI);
  ctx.closePath();
  ctx.fill();

  // 底层顶面（奶油）
  drawEllipse(cx, bottomY - bottomH, bottomW, 20 * cakeScale, '#fff5e8');
  // 奶油花纹
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI;
    const px = cx + Math.cos(angle) * bottomW * 0.85;
    const py = bottomY - bottomH + Math.sin(angle) * 20 * cakeScale * 0.85;
    drawEllipse(px, py, 10 * cakeScale, 6 * cakeScale, '#fff');
  }
  // 彩色装饰球
  const decorColors = ['#ff6b9d', '#48dbfb', '#feca57', '#a29bfe'];
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const px = cx + Math.cos(angle) * bottomW * 0.7;
    const py = bottomY - bottomH * 0.5;
    ctx.fillStyle = decorColors[i % 4];
    ctx.beginPath();
    ctx.arc(px, py, 8 * cakeScale, 0, Math.PI * 2);
    ctx.fill();
  }

  // 中层
  const midY = bottomY - bottomH;
  const midW = 95 * cakeScale;
  const midH = 55 * cakeScale;

  const mGrad = ctx.createLinearGradient(cx - midW, midY, cx + midW, midY);
  mGrad.addColorStop(0, '#fff0f5');
  mGrad.addColorStop(0.5, '#fff5e8');
  mGrad.addColorStop(1, '#fff0f5');
  ctx.fillStyle = mGrad;
  ctx.beginPath();
  ctx.moveTo(cx - midW, midY);
  ctx.lineTo(cx - midW, midY - midH);
  ctx.lineTo(cx + midW, midY - midH);
  ctx.lineTo(cx + midW, midY);
  ctx.ellipse(cx, midY, midW, 15 * cakeScale, 0, 0, Math.PI);
  ctx.closePath();
  ctx.fill();

  drawEllipse(cx, midY - midH, midW, 15 * cakeScale, '#ffd9ec');
  // 中层花边
  for (let i = 0; i < 7; i++) {
    const angle = (i / 7) * Math.PI;
    const px = cx + Math.cos(angle) * midW * 0.88;
    const py = midY - midH + Math.sin(angle) * 15 * cakeScale * 0.88;
    drawEllipse(px, py, 8 * cakeScale, 5 * cakeScale, '#ff9ecd');
  }

  // 顶层
  const topY = midY - midH;
  const topW = 60 * cakeScale;
  const topH = 45 * cakeScale;

  const tGrad = ctx.createLinearGradient(cx - topW, topY, cx + topW, topY);
  tGrad.addColorStop(0, '#feca57');
  tGrad.addColorStop(0.5, '#ffd97a');
  tGrad.addColorStop(1, '#feca57');
  ctx.fillStyle = tGrad;
  ctx.beginPath();
  ctx.moveTo(cx - topW, topY);
  ctx.lineTo(cx - topW, topY - topH);
  ctx.lineTo(cx + topW, topY - topH);
  ctx.lineTo(cx + topW, topY);
  ctx.ellipse(cx, topY, topW, 10 * cakeScale, 0, 0, Math.PI);
  ctx.closePath();
  ctx.fill();

  drawEllipse(cx, topY - topH, topW, 10 * cakeScale, '#fff5e8');
  // 顶层层花边
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI;
    const px = cx + Math.cos(angle) * topW * 0.88;
    const py = topY - topH + Math.sin(angle) * 10 * cakeScale * 0.88;
    drawEllipse(px, py, 7 * cakeScale, 4 * cakeScale, decorColors[i % 4]);
  }

  // 蜡烛
  const candleBaseY = topY - topH;
  candles.forEach((c, i) => {
    const candleX = cx + c.x * 100 * cakeScale;
    const candleH = 35 * cakeScale;

    // 蜡烛体
    const candleColors = ['#ff9ff3', '#48dbfb', '#feca57'];
    ctx.fillStyle = candleColors[i];
    ctx.fillRect(candleX - 4 * cakeScale, candleBaseY - candleH, 8 * cakeScale, candleH);

    // 蜡烛体高光
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(candleX - 3 * cakeScale, candleBaseY - candleH, 2 * cakeScale, candleH);

    // 火焰
    if (c.alive || (time - c.blownTime < 0.5)) {
      let flameScale = 1;
      let flameOpacity = 1;
      let flameTilt = 0;
      let flameY = candleBaseY - candleH;

      if (!c.alive) {
        const elapsed = time - c.blownTime;
        const progress = elapsed / 0.5;
        flameScale = Math.max(0.01, 1 - progress);
        flameOpacity = 1 - progress;
        flameY = candleBaseY - candleH + progress * 10;
      } else if (blowState === 'wishing') {
        flameScale = 1 + Math.sin(time * 8 + i) * 0.15;
        flameTilt = Math.sin(time * 6 + i) * 0.2;
      } else if (blowState === 'blowing') {
        const elapsed = time - blowStartTime;
        const progress = Math.min(1, elapsed / 1.0);
        const blowStrength = Math.sin(progress * Math.PI);
        flameScale = 1 + Math.sin(time * 15 + i) * 0.2;
        flameTilt = blowStrength * 0.8 + Math.sin(time * 20 + i) * 0.2;
      } else {
        flameScale = 1 + Math.sin(time * 7 + i) * 0.1;
        flameTilt = Math.sin(time * 5 + i) * 0.1;
      }

      const flameW = 8 * cakeScale * flameScale;
      const flameH = 18 * cakeScale * flameScale;
      const flameX = candleX + flameTilt * 10;

      ctx.globalAlpha = flameOpacity;

      // 外层光晕
      const glowGrad = ctx.createRadialGradient(flameX, flameY - flameH/2, 0, flameX, flameY - flameH/2, flameW * 3);
      glowGrad.addColorStop(0, 'rgba(255, 200, 0, 0.4)');
      glowGrad.addColorStop(0.5, 'rgba(255, 150, 0, 0.15)');
      glowGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(flameX, flameY - flameH/2, flameW * 3, 0, Math.PI * 2);
      ctx.fill();

      // 火焰本体（泪滴形）
      ctx.fillStyle = '#ff9800';
      ctx.beginPath();
      ctx.ellipse(flameX, flameY - flameH * 0.4, flameW * 0.7, flameH * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath();
      ctx.ellipse(flameX, flameY - flameH * 0.5, flameW * 0.5, flameH * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(flameX, flameY - flameH * 0.6, flameW * 0.25, flameH * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 1;
    }
  });

  // 在蛋糕盘子右侧画一只可爱的小牛
  if (cakeScale > 0.5) {
    drawCuteCow(cx + 90 * cakeScale, cy - 5, 25 * cakeScale);
  }

  ctx.restore();
}

// 画可爱的小牛
function drawCuteCow(x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  const s = size / 30;

  // 身体（椭圆，粉白色）
  ctx.fillStyle = '#fff5f0';
  ctx.beginPath();
  ctx.ellipse(0, 0, 18 * s, 14 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#8b6f47';
  ctx.lineWidth = 1.5 * s;
  ctx.stroke();

  // 身上的棕色斑块
  ctx.fillStyle = '#c4956a';
  ctx.beginPath();
  ctx.ellipse(-6 * s, -3 * s, 6 * s, 4 * s, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(8 * s, 2 * s, 5 * s, 3.5 * s, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // 头（圆形）
  ctx.fillStyle = '#fff5f0';
  ctx.beginPath();
  ctx.arc(-16 * s, -10 * s, 10 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 耳朵
  ctx.fillStyle = '#f5c6c6';
  ctx.beginPath();
  ctx.ellipse(-22 * s, -16 * s, 3 * s, 4 * s, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(-12 * s, -18 * s, 3 * s, 4 * s, 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 牛角（小三角形）
  ctx.fillStyle = '#d4a574';
  ctx.beginPath();
  ctx.moveTo(-20 * s, -18 * s);
  ctx.lineTo(-22 * s, -24 * s);
  ctx.lineTo(-18 * s, -20 * s);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-14 * s, -20 * s);
  ctx.lineTo(-12 * s, -26 * s);
  ctx.lineTo(-10 * s, -19 * s);
  ctx.closePath();
  ctx.fill();

  // 眼睛
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(-19 * s, -11 * s, 1.5 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-13 * s, -11 * s, 1.5 * s, 0, Math.PI * 2);
  ctx.fill();

  // 眼睛高光
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-18.5 * s, -11.5 * s, 0.5 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-12.5 * s, -11.5 * s, 0.5 * s, 0, Math.PI * 2);
  ctx.fill();

  // 鼻子（粉色椭圆）
  ctx.fillStyle = '#ffb3b3';
  ctx.beginPath();
  ctx.ellipse(-16 * s, -7 * s, 3.5 * s, 2.5 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  // 鼻孔
  ctx.fillStyle = '#e69999';
  ctx.beginPath();
  ctx.arc(-17 * s, -7 * s, 0.5 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-15 * s, -7 * s, 0.5 * s, 0, Math.PI * 2);
  ctx.fill();

  // 腮红
  ctx.fillStyle = 'rgba(255, 180, 180, 0.5)';
  ctx.beginPath();
  ctx.arc(-22 * s, -8 * s, 2 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-10 * s, -8 * s, 2 * s, 0, Math.PI * 2);
  ctx.fill();

  // 腿
  ctx.fillStyle = '#c4956a';
  ctx.fillRect(-8 * s, 10 * s, 4 * s, 6 * s);
  ctx.fillRect(8 * s, 10 * s, 4 * s, 6 * s);

  // 尾巴
  ctx.strokeStyle = '#8b6f47';
  ctx.lineWidth = 1.5 * s;
  ctx.beginPath();
  ctx.moveTo(16 * s, 0);
  ctx.quadraticCurveTo(22 * s, 4 * s, 20 * s, 12 * s);
  ctx.stroke();
  // 尾巴末端
  ctx.fillStyle = '#c4956a';
  ctx.beginPath();
  ctx.arc(20 * s, 12 * s, 2 * s, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// 画烟花
// 更新 3D 烟花粒子（物理 + 同步到 BufferGeometry）
function drawFireworks() {
  if (!cake3D || !cake3D.fireworkField) return;

  const fw = cake3D.fireworkField;
  const posAttr = fw.geometry.attributes.position;
  const colAttr = fw.geometry.attributes.color;
  const sizeAttr = fw.geometry.attributes.aSize;
  const posArr = posAttr.array;
  const colArr = colAttr.array;
  const sizeArr = sizeAttr.array;

  // 倒序遍历更新物理 + 删除死亡粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.z += p.vz;
    p.vy -= 0.0025;     // 重力（加强降落感）
    p.vx *= 0.99;       // 阻力减小，飘得更远
    p.vz *= 0.99;
    p.life -= p.decay;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }

  // 把存活粒子写入 BufferGeometry（带 life 衰减的颜色亮度）
  const n = Math.min(particles.length, FW_MAX);
  for (let i = 0; i < n; i++) {
    const p = particles[i];
    posArr[i * 3]     = p.x;
    posArr[i * 3 + 1] = p.y;
    posArr[i * 3 + 2] = p.z;
    // 颜色：十六进制转 RGB，乘以 life 实现淡出
    const c = p.color;
    const r = ((c >> 16) & 0xff) / 255 * p.life;
    const g = ((c >> 8) & 0xff) / 255 * p.life;
    const b = (c & 0xff) / 255 * p.life;
    colArr[i * 3]     = r;
    colArr[i * 3 + 1] = g;
    colArr[i * 3 + 2] = b;
    // 粒子大小：独立 pSize，随 life 衰减（消亡时变小）
    sizeArr[i] = p.pSize * (0.4 + p.life * 0.6);
  }
  fw.geometry.setDrawRange(0, n);
  posAttr.needsUpdate = true;
  colAttr.needsUpdate = true;
  sizeAttr.needsUpdate = true;
}

let bgAlpha = 0.15;        // 当前alpha
let bgAlphaTarget = 0.15;  // 目标alpha

function animate() {
  // 惰性初始化 Three.js 3D 蛋糕（仅一次）
  if (!cake3D && typeof THREE !== 'undefined') initCake3D();

  // 根据状态设定目标alpha
  if (blowState === 'wishing' || blowState === 'blowing') {

  } else if (blowState === 'blown') {
    bgAlphaTarget = 0.15;  // 目标：变亮
  } else {
    bgAlphaTarget = 0.15;  // 正常
  }

  // 平滑过渡（每帧逼近目标值）
  bgAlpha += (bgAlphaTarget - bgAlpha) * 0.02;  // 过渡速度

  // 清屏
  ctx.fillStyle = 'rgba(10, 10, 30, ' + bgAlpha + ')';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  time += 0.016;

  // 蛋糕缩放动画
  if (cakeVisible && cakeScale < 1) {
    cakeScale = Math.min(1, cakeScale + 0.03);

  // 自动旋转（这里简化，实际是视角变化，我们用cakeScale体现）

  // Three.js 3D 蛋糕（与 2D 并存，透明叠加）
  updateCake3D();

// ===== 麦克风吹气检测 =====
let micStream = null;
let micAnalyser = null;
let micActive = false;

// 启动麦克风，检测吹气（音量超阈值时触发回调）
// 返回 Promise<boolean>：true=麦克风已启动，false=不可用
function startBlowDetection(onBlow) {
  return new Promise(function(resolve) {
    // 检查浏览器是否支持
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('⚠️ 当前浏览器不支持麦克风功能\n建议用最新版 Safari 打开\n将自动为您熄灭蜡烛');
      resolve(false);
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } })
      .then(function(stream) {
        micStream = stream;
        var audioCtx = getAudioCtx();
        // iOS Safari 需要在用户手势内 resume
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var source = audioCtx.createMediaStreamSource(stream);
        micAnalyser = audioCtx.createAnalyser();
        micAnalyser.fftSize = 512;
        micAnalyser.smoothingTimeConstant = 0.3;
        source.connect(micAnalyser);
        micActive = true;

        var data = new Uint8Array(micAnalyser.frequencyBinCount);
        var blowFrames = 0;
        var BLOW_THRESHOLD = 60;   // 音量阈值（降低，更灵敏）
        var BLOW_FRAMES_NEEDED = 5; // 连续帧数（减少，更快响应）

        function check() {
          if (!micActive) return;
          micAnalyser.getByteFrequencyData(data);
          var sum = 0;
          for (var i = 0; i < 40; i++) sum += data[i];
          var avg = sum / 40;

          if (avg > BLOW_THRESHOLD) {
            blowFrames++;
            if (blowFrames >= BLOW_FRAMES_NEEDED) {
              micActive = false;
              stopMic();
              onBlow();
              return;
            }
          } else {
            blowFrames = Math.max(0, blowFrames - 1);
          }
          requestAnimationFrame(check);
        }
        requestAnimationFrame(check);
        resolve(true);
      })
      .catch(function(e) {
        // 权限被拒或其他错误
        alert('⚠️ 麦克风权限被拒绝或不可用\n将自动为您熄灭蜡烛\n\n错误: ' + (e.message || e.name));
        resolve(false);
      });
  });
}

function stopMic() {
  micActive = false;
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}

}

// 计算SVG path的总长度（用于描边动画）
function getPathLength(pathStr, scale) {
  const path = new Path2D(pathStr);
  // 用 measureText 不可行，改用离屏canvas的 Path2D + 通过绘制点采样
  // 实际上我们不需要精确长度，用 stroke-dasharray 思路：
  // 直接用 setLineDash 配合 lineDashOffset
  return path;
}

// 在指定位置绘制一个字的笔画（按进度）
// progress 0~1 表示这个字的整体书写进度
function drawCharStrokes(char, cx, cy, charSize, progress) {
  const strokes = STROKE_DATA[char];
  if (!strokes) {
    // 没有数据，直接绘制文字
    wishCtx.save();
    wishCtx.font = charSize + 'px "PingFang SC", "Microsoft YaHei", serif';
    wishCtx.fillStyle = '#fff';
    wishCtx.textAlign = 'center';
    wishCtx.textBaseline = 'middle';
    wishCtx.shadowColor = 'rgba(255,255,255,0.7)';
    wishCtx.shadowBlur = 12;
    wishCtx.fillText(char, cx, cy);
    wishCtx.restore();
    return;
  }

  // SVG 坐标系：0~1024，映射到 charSize
  // makemeahanzi 字库的 Y 轴向上（数学坐标系），需要翻转 Y 轴才能正常显示
  const scale = charSize / 1024;
  const offsetX = cx - charSize / 2;
  const offsetY = cy + charSize / 2;  // 注意：翻转Y轴后，原点在底部

  // 计算每个笔画的时间段
  const totalStrokes = strokes.length;
  const strokeDuration = 1 / totalStrokes;

  wishCtx.save();
  wishCtx.translate(offsetX, offsetY);
  wishCtx.scale(scale, -scale);  // Y轴翻转（负scale）
  wishCtx.strokeStyle = '#ffffff';
  wishCtx.lineWidth = 38;  // 在1024坐标系下的线宽
  wishCtx.lineCap = 'round';
  wishCtx.lineJoin = 'round';
  wishCtx.shadowColor = 'rgba(255,255,255,0.6)';
  wishCtx.shadowBlur = 20;

  strokes.forEach((stroke, i) => {
    const strokeStart = i * strokeDuration;
    const strokeEnd = (i + 1) * strokeDuration;
    if (progress <= strokeStart) return;

    let strokeProgress;
    if (progress >= strokeEnd) {
      strokeProgress = 1;
    } else {
      strokeProgress = (progress - strokeStart) / strokeDuration;
    }

    const path = new Path2D(stroke);

    if (strokeProgress >= 1) {
      wishCtx.stroke(path);
    } else {
      const dashLen = 5000;
      wishCtx.save();
      wishCtx.setLineDash([dashLen, dashLen]);
      wishCtx.lineDashOffset = dashLen * (1 - strokeProgress);
      wishCtx.stroke(path);
      wishCtx.restore();
    }
  });

  wishCtx.restore();
}

// 计算笔尖位置（当前正在写的那个笔画，进度的末端）
function getPenPosition(char, cx, cy, charSize, progress) {
  const strokes = STROKE_DATA[char];
  if (!strokes) return null;
  const totalStrokes = strokes.length;
  const strokeDuration = 1 / totalStrokes;
  const scale = charSize / 1024;
  const offsetX = cx - charSize / 2;
  const offsetY = cy + charSize / 2;  // 与drawCharStrokes保持一致（Y轴翻转）

  // 找到当前正在画的笔画
  let currentStrokeIdx = -1;
  let strokeProgress = 0;
  for (let i = 0; i < totalStrokes; i++) {
    const strokeStart = i * strokeDuration;
    const strokeEnd = (i + 1) * strokeDuration;
    if (progress > strokeStart && progress < strokeEnd) {
      currentStrokeIdx = i;
      strokeProgress = (progress - strokeStart) / strokeDuration;
      break;
    }
  }
  if (currentStrokeIdx === -1) return null;

  // 解析path，找端点
  const stroke = strokes[currentStrokeIdx];
  const points = parsePathPoints(stroke);
  if (points.length === 0) return null;

  // 在path上按进度找位置（简化：按点采样）
  const idx = Math.floor(strokeProgress * (points.length - 1));
  const p = points[Math.min(idx, points.length - 1)];
  return {
    x: offsetX + p.x * scale,
    y: offsetY - p.y * scale  // Y轴翻转：字库y大=屏幕y小
  };
}

// 简单解析path中的坐标点（用于笔尖跟随）
function parsePathPoints(pathStr) {
  const points = [];
  // 匹配 M x y, L x y, Q x1 y1 x y 等命令后面的坐标
  const tokens = pathStr.match(/[MLQCSA][\d\s\.\-]+/g);
  if (!tokens) return points;
  tokens.forEach(tok => {
    const cmd = tok[0];
    const nums = tok.slice(1).trim().split(/\s+/).map(Number);
    if (cmd === 'M' || cmd === 'L') {
      if (nums.length >= 2) points.push({ x: nums[0], y: nums[1] });
    } else if (cmd === 'Q' || cmd === 'C') {
      // Q 控制点 终点；C 控制点1 控制点2 终点
      // 只取终点
      if (cmd === 'Q' && nums.length >= 4) points.push({ x: nums[2], y: nums[3] });
      if (cmd === 'C' && nums.length >= 6) points.push({ x: nums[4], y: nums[5] });
    }
  });
  return points;
}

// 判断是否中文
function isChinese(ch) {
  return /[\u4e00-\u9fff]/.test(ch);
}

// ============ 名字"坏女人"笔画动画 ============
function drawName() {
  const nameCanvas = document.getElementById('name-canvas');
  const nCtx = nameCanvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const chars = ['坏', '女', '人'];
  const charSize = 48;
  const spacing = 12;
  const totalW = chars.length * charSize + (chars.length - 1) * spacing;
  const w = totalW + 20;
  const h = charSize + 20;
  nameCanvas.width = w * dpr;
  nameCanvas.height = h * dpr;
  nameCanvas.style.width = w + 'px';
  nameCanvas.style.height = h + 'px';
  nCtx.scale(dpr, dpr);

  const items = chars.map((ch, i) => ({
    char: ch,
    progress: 0,
    cx: 10 + charSize / 2 + i * (charSize + spacing),
    cy: h / 2
  }));

  function render() {
    nCtx.clearRect(0, 0, w, h);
    let penPos = null;
    items.forEach(item => {
      if (item.progress <= 0) return;
      // 用金色渐变笔画
      nCtx.save();
      // 先画到临时canvas再染色比较复杂，这里直接用金色描边
      const strokes = STROKE_DATA[item.char];
      if (!strokes) return;
      const scale = charSize / 1024;
      const offsetX = item.cx - charSize / 2;
      const offsetY = item.cy + charSize / 2;

      const totalStrokes = strokes.length;
      const strokeDuration = 1 / totalStrokes;

      nCtx.translate(offsetX, offsetY);
      nCtx.scale(scale, -scale);
      nCtx.strokeStyle = '#ffd700';
      nCtx.lineWidth = 38;
      nCtx.lineCap = 'round';
      nCtx.lineJoin = 'round';
      nCtx.shadowColor = 'rgba(255, 215, 0, 0.8)';
      nCtx.shadowBlur = 20;

      strokes.forEach((stroke, i) => {
        const strokeStart = i * strokeDuration;
        const strokeEnd = (i + 1) * strokeDuration;
        if (item.progress <= strokeStart) return;

        let sp;
        if (item.progress >= strokeEnd) sp = 1;
        else sp = (item.progress - strokeStart) / strokeDuration;

        const path = new Path2D(stroke);
        if (sp >= 1) {
          nCtx.stroke(path);
        } else {
          const dashLen = 5000;
          nCtx.save();
          nCtx.setLineDash([dashLen, dashLen]);
          nCtx.lineDashOffset = dashLen * (1 - sp);
          nCtx.stroke(path);
          nCtx.restore();
        }
      });

      nCtx.restore();
    });
  }

  let idx = 0;
  function writeNext() {
    if (idx >= items.length) return;
    const item = items[idx];
    const duration = 700;
    const startTime = performance.now();
    function step(now) {
      const t = Math.min(1, (now - startTime) / duration);
      item.progress = t;
      render();
      if (t < 1) requestAnimationFrame(step);
      else {
        playTypeSound();
        idx++;
        setTimeout(writeNext, 100);
      }
    }
    requestAnimationFrame(step);
  }
  writeNext();
}
