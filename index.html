      else if (/[0-9]/.test(ch)) w = cs * 0.7;
      else w = cs * 0.55;
      return sum + w + charSpacing;
    }, 0);
  });
  const maxWidth = Math.max(...lineWidths);
  const dpr = window.devicePixelRatio || 1;
  const canvasW = wishCanvas.width / dpr;
  const startX = (canvasW - maxWidth) / 2;
  const startY = 50;

  // 计算每个字的位置和类型
  const items = [];
  layout.forEach((line, lineIdx) => {
    const lineWidth = lineWidths[lineIdx];
    const isBig = bigLineSet.has(lineIdx);
    const cs = isBig ? bigCharSize : charSize;
    let x = startX + (maxWidth - lineWidth) / 2;
    line.forEach(ch => {
      let w;
      if (isChinese(ch)) w = cs;
      else if (/[0-9]/.test(ch)) w = cs * 0.7;
      else w = cs * 0.55;
      items.push({
        char: ch,
        x: x + w / 2,
        y: startY + lineIdx * lineSpacing,
        isChinese: isChinese(ch),
        big: isBig,
        progress: 0
      });
      x += w + charSpacing;
    });
  });

  // 清空
  wishCtx.clearRect(0, 0, wishCanvas.width / dpr, wishCanvas.height / dpr);

  // 渲染所有字（按各自的progress）
  function render() {
    wishCtx.clearRect(0, 0, wishCanvas.width / dpr, wishCanvas.height / dpr);
    let penPos = null;
    items.forEach(item => {
      if (item.progress <= 0) return;
      const cs = item.big ? bigCharSize : charSize;   // 大字体行用 bigCharSize
      // 性能优化：写完的字（progress=1）直接 fillText 静态显示，不走笔画描边
      if (item.isChinese && STROKE_DATA[item.char] && item.progress < 1) {
        // 正在写的字：手写笔画动画
        drawCharStrokes(item.char, item.x, item.y, cs, item.progress);
        penPos = getPenPosition(item.char, item.x, item.y, cs, item.progress);
      } else if (item.isChinese && STROKE_DATA[item.char] && item.progress >= 1) {
        // 写完的字：直接 fillText 静态显示（避免每帧重做笔画描边）
        wishCtx.save();
        wishCtx.font = Math.round(cs * 0.95) + 'px "STKaiti", "KaiTi", "Songti SC", serif';
        wishCtx.fillStyle = '#fff';
        wishCtx.textAlign = 'center';
        wishCtx.textBaseline = 'middle';
        wishCtx.shadowColor = 'rgba(255,255,255,0.7)';
        wishCtx.shadowBlur = 12;
        wishCtx.fillText(item.char, item.x, item.y);
        wishCtx.restore();
      } else if (item.isChinese) {
        // 无笔画数据的中文：回退到字体渐显渲染（楷体，风格协调）
        wishCtx.save();
        wishCtx.globalAlpha = item.progress;
        wishCtx.font = Math.round(cs * 0.95) + 'px "STKaiti", "KaiTi", "Songti SC", serif';
        wishCtx.fillStyle = '#fff';
        wishCtx.textAlign = 'center';
        wishCtx.textBaseline = 'middle';
        wishCtx.shadowColor = 'rgba(255,255,255,0.7)';
        wishCtx.shadowBlur = 12;
        wishCtx.fillText(item.char, item.x, item.y);
        wishCtx.restore();
      } else if (DIGIT_STROKE_DATA[item.char]) {
        // 数字：用楷体，和中文笔画风格协调
        wishCtx.save();
        wishCtx.globalAlpha = item.progress;
        wishCtx.font = Math.round(cs * 0.95) + 'px "STKaiti", "KaiTi", "Songti SC", serif';
        wishCtx.fillStyle = '#fff';
        wishCtx.textAlign = 'center';
        wishCtx.textBaseline = 'middle';
        wishCtx.shadowColor = 'rgba(255,255,255,0.7)';
        wishCtx.shadowBlur = 12;
        wishCtx.fillText(item.char, item.x, item.y);
        wishCtx.restore();
      } else {
        // 标点：渐显
        wishCtx.save();
        wishCtx.globalAlpha = item.progress;
        wishCtx.font = (cs * 0.85) + 'px "PingFang SC", serif';
        wishCtx.fillStyle = '#fff';
        wishCtx.textAlign = 'center';
        wishCtx.textBaseline = 'middle';
        wishCtx.shadowColor = 'rgba(255,255,255,0.6)';
        wishCtx.shadowBlur = 10;
        wishCtx.fillText(item.char, item.x, item.y);
        wishCtx.restore();
      }
    });

    // 绘制笔尖
    if (penPos) {
      wishCtx.save();
      const grad = wishCtx.createRadialGradient(penPos.x, penPos.y, 0, penPos.x, penPos.y, 14);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.3, 'rgba(255,215,0,0.9)');
      grad.addColorStop(1, 'rgba(255,215,0,0)');
      wishCtx.fillStyle = grad;
      wishCtx.beginPath();
      wishCtx.arc(penPos.x, penPos.y, 14, 0, Math.PI * 2);
      wishCtx.fill();
      wishCtx.restore();
    }
  }

  // 按顺序书写
  let idx = 0;
  function writeNext() {
    if (idx >= items.length) {
      wishAnimating = false;
      // 祝福语写完后，只显示许愿按钮（不显示 hint）
      document.getElementById('actions').classList.add('show');
      return;
    }
    const item = items[idx];
    // 有笔画数据的中文用长动画（笔画描边）；无笔画的中文用短渐显（快速出现，模拟书写节奏）
    const hasStroke = item.isChinese && STROKE_DATA[item.char];
    const duration = hasStroke ? 700 : (item.isChinese ? 120 : 200);
    const startTime = performance.now();

    function step(now) {
      const elapsed = now - startTime;
      const t = Math.min(1, elapsed / duration);
      item.progress = t;
      render();
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        playTypeSound();
        idx++;
        let delay = 60;
        if (item.char === '，' || item.char === '、' || item.char === '！') {
          delay = 350;
        }
        setTimeout(writeNext, delay);
      }
    }
    requestAnimationFrame(step);
  }
  writeNext();
}

window.celebrate = celebrate;
window.doWish = doWish;
window.doBlow = doBlow;

// 点击放烟花（非蛋糕区域）
let clickEnabled = false;
setTimeout(() => { clickEnabled = true; }, 3500);
document.addEventListener('click', function(e) {
  if (!clickEnabled) return;
  if (e.target.closest('#gift')) return;
  if (e.target.closest('.btn')) return;
  if (blowState === 'wishing' || blowState === 'blowing') return;
  launchFirework(e.clientX, e.clientY);
});
</script>
